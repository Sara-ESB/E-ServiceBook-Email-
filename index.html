<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>E‑Service Book Email Platform</title>
<link rel="icon" type="image/png" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&family=Source+Serif+4:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2ef;--cd:#fff;--tx:#17231c;--mu:#5d6a62;--g:#0B3C26;--au:#B58922;--rd:#9E2A2B;--ln:#d9e0db;--gt:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1511;--cd:#16201a;--tx:#e9eeea;--mu:#9aa89f;--g:#7fc79f;--ln:#26342b;--gt:#0e1511;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1511;--cd:#16201a;--tx:#e9eeea;--mu:#9aa89f;--g:#7fc79f;--ln:#26342b;--gt:#0e1511;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Hind Siliguri",system-ui,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;background:var(--cd);border-bottom:2px solid var(--au)}
h1{font:600 18px "Source Serif 4",Georgia,serif;margin:0;color:var(--g)}
#logo{width:40px;height:40px;border-radius:50%;background:#fff;flex:none}
@media(min-width:700px){#logo{width:52px;height:52px}}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:4px;overflow-x:auto;padding:8px 12px;background:var(--cd);border-bottom:1px solid var(--ln)}
nav button{flex:none;border:0;background:none;color:var(--mu);padding:8px 12px;border-radius:8px;font:inherit;cursor:pointer}
nav button.on{background:var(--g);color:var(--gt)}
main{padding:14px 14px 90px;max-width:900px;margin:auto}
.c{background:var(--cd);border:1px solid var(--ln);border-radius:10px;padding:14px;margin-bottom:12px}
h2{font:600 16px "Source Serif 4",Georgia,serif;margin:0 0 10px;color:var(--g)}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 3px}
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:8px 10px}
textarea{min-height:110px;resize:vertical}
button.b{background:var(--g);color:var(--gt);border:0;border-radius:8px;padding:9px 14px;font:inherit;cursor:pointer;margin:8px 6px 0 0}
button.b.s{background:none;color:var(--g);border:1px solid var(--g)}button.b.d{background:none;color:var(--rd);border:1px solid var(--rd)}
.r{display:flex;gap:10px;flex-wrap:wrap}.r>*{flex:1 1 150px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--ln)}
.row:first-of-type{border-top:0}.row small{color:var(--mu);display:block}
.t{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--ln);white-space:nowrap}
.t.sent,.t.ready{color:var(--g);border-color:var(--g)}.t.failed,.t.banned{color:var(--rd);border-color:var(--rd)}.t.own{background:var(--au);color:#fff;border-color:var(--au)}.t.adm{color:var(--au);border-color:var(--au)}
.bar{height:10px;background:var(--ln);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--au)}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}.k div{padding:10px;border:1px solid var(--ln);border-radius:8px}.k b{font-size:22px;color:var(--g);display:block}
.m{background:#fff3d6;color:#5a4410;border-radius:8px;padding:8px 10px;font-size:13px;margin-bottom:10px}.ok{color:var(--g);font-size:13px;margin-top:8px}
.wa{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;background:#25D366;display:grid;place-items:center;z-index:9;box-shadow:0 3px 10px rgba(0,0,0,.3)}
</style></head><body>
<header><h1>E‑Service Book<br><span style="font:400 12px 'Hind Siliguri';color:var(--mu)">Email &amp; WhatsApp Platform</span></h1>
<div id="who" style="flex:1;text-align:right;font-size:12px;line-height:1.5"></div><img id="logo" src="logo.png" alt="Bangladesh e‑Servicebook Company Ltd. logo"></header>
<nav id="nav"></nav><main id="v"></main>
<a class="wa" id="wa" target="_blank" rel="noopener" aria-label="Chat with us on WhatsApp"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21l1.6-4.6A9 9 0 1 1 8 19.6z"/><path d="M9 8c0 3.5 3 6.5 6.5 6.5l1-1.4-2-1-.8.8c-1-.4-2-1.4-2.4-2.4l.8-.8-1-2z" fill="#fff" stroke="none"/></svg></a>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
const sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY),CAP=300;
const $=i=>document.getElementById(i),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let ME=null,tab="dash",CH="em",msg="",AT="in",D={mode:"single"},C=[],M=[],U=[],L=[];
const RL=()=>({user:1,admin:2,super:3}[ME&&ME.role]||0),okE=x=>/^\S+@\S+\.\S+$/.test(x||"");
const ph=x=>{let d=String(x||"").replace(/\D/g,"");if(d.length===11&&d[0]==="0")d="88"+d;return d};
const okP=p=>/^8801[3-9]\d{8}$/.test(p)||(!/^880/.test(p)&&/^[1-9]\d{9,14}$/.test(p));
const CATS=()=>[...new Set(["Student","Employee","Employer"].concat(C.map(c=>c.category)))];
const tag=u=>u.role==="super"?'<span class="t own">supreme-admin · Owner</span>':u.role==="admin"?'<span class="t adm">Admin</span>':'<span class="t">User</span>';
const logA=a=>sb.rpc("log_action",{a});
const TPL=["Welcome to E‑Service Book","Hello {{name}},\n\nWelcome! E‑Service Book keeps your service records digital, safe and easy to find.\n\nRegards,\nE‑Service Book Team"];
$("wa").href="https://wa.me/"+CFG.WA_NUMBER+"?text="+encodeURIComponent("Hello E‑Service Book team, I would like to know more.");
async function init(){const {data:{session}}=await sb.auth.getSession();if(session)await boot();else draw()}
async function boot(){const {data:{user}}=await sb.auth.getUser();const {data}=await sb.from("profiles").select("*").eq("id",user.id).single();ME=data;
 if(!ME||ME.status==="banned"){msg="This account is banned or missing. Ask an admin to reactivate it.";await sb.auth.signOut();ME=null;return draw()}await refresh();draw()}
async function refresh(){const a=await Promise.all([sb.from("contacts").select("*").order("created_at",{ascending:false}).limit(2000),sb.from("messages").select("*").order("created_at",{ascending:false}).limit(500)]);C=a[0].data||[];M=a[1].data||[];
 if(RL()>=2){const b=await Promise.all([sb.from("profiles").select("*").order("created_at"),sb.from("activity_log").select("*").order("at",{ascending:false}).limit(200)]);U=b[0].data||[];L=b[1].data||[]}}
function draw(){$("who").innerHTML=ME?`<b>${esc(ME.name)}</b> ${tag(ME)}<br><a href="#" onclick="out();return false" style="color:var(--g)">Sign out</a>`:"";
 if(!ME){$("nav").innerHTML="";return $("v").innerHTML=authV()}
 const T=[["dash","Dashboard"],["contacts","Contacts"],["compose","Compose"],["hist","History"],["sched","Scheduled"]].concat(RL()>=2?[["users","Users"],["log","Activity log"]]:[],[["help","Help"]]);
 if(!T.some(t=>t[0]===tab))tab="dash";
 $("nav").innerHTML=T.map(t=>`<button class="${t[0]===tab?"on":""}" onclick="tab='${t[0]}';msg='';draw()">${t[1]}</button>`).join("");
 $("v").innerHTML=chBar()+({dash,contacts,compose,hist,sched,users,log,help}[tab])()}
function chBar(){const w=CH==="wa";return`<div class="r" style="margin-bottom:12px"><button class="b ${w?"s":""}" style="margin:0" onclick="setCh('em')">Email</button><button class="b ${w?"":"s"}" style="margin:0;${w?"background:#25D366;border-color:#25D366;color:#fff":""}" onclick="setCh('wa')">WhatsApp</button></div>`}
function setCh(x){CH=x;D={mode:"single"};msg="";draw()}
function authV(){const t=(k,l)=>`<button class="b ${AT===k?"":"s"}" style="margin:0 6px 8px 0" onclick="AT='${k}';msg='';draw()">${l}</button>`;
 const f=AT==="in"?`<label>Email</label><input id="le" type="email" autocomplete="username"><label>Password</label><input id="lp" type="password" autocomplete="current-password"><button class="b" onclick="login()">Log in</button><p style="font-size:13px;color:var(--mu)">You stay logged in on this device until you sign out.</p>`
 :AT==="up"?`<label>Your name</label><input id="sn" autocomplete="name"><label>Username</label><input id="su" autocapitalize="none"><label>Email</label><input id="se" type="email" autocomplete="username"><label>Password (6+ characters)</label><input id="sp" type="password" autocomplete="new-password"><button class="b" onclick="signup()">Create account</button><p style="font-size:13px;color:var(--mu)">New accounts start as User. The owner can give you the Admin role.</p>`
 :`<label>Owner username</label><input value="supreme-admin" readonly><label>Owner email</label><input id="oe" type="email" autocomplete="username"><label>Password (6+ characters)</label><input id="op" type="password" autocomplete="new-password"><label>Owner code</label><input id="oc" type="password" autocomplete="off"><button class="b" onclick="mkOwner()">Create owner account</button>`;
 return`<div class="c" style="max-width:420px;margin:30px auto"><h2>E‑Service Book Platform</h2>${t("in","Log in")}${t("up","Sign up")}${t("own","Owner setup")}${f}<div class="ok">${esc(msg)}</div></div>`}
async function login(){const {error}=await sb.auth.signInWithPassword({email:$("le").value.trim(),password:$("lp").value});if(error){msg="Wrong email or password.";return draw()}msg="";await boot();logA("Logged in")}
async function out(){await logA("Logged out");await sb.auth.signOut();ME=null;tab="dash";AT="in";draw()}
async function signup(){const u=$("su").value.trim().toLowerCase(),n=$("sn").value.trim();
 if(!n||!/^[a-z0-9._-]{3,}$/.test(u)||u==="supreme-admin"||$("sp").value.length<6){msg="Enter your name, a username (3+ letters or numbers) and a password of 6+ characters.";return draw()}
 const {data,error}=await sb.auth.signUp({email:$("se").value.trim(),password:$("sp").value,options:{data:{name:n,username:u}}});
 if(error){msg=error.message;return draw()}
 if(data.session){await boot();logA("New account created")}else{msg="Account created. Check your email to confirm it, then log in.";AT="in";draw()}}
async function mkOwner(){const {data,error}=await sb.auth.signUp({email:$("oe").value.trim(),password:$("op").value,options:{data:{name:"Owner",username:"owner"}}});
 if(error||!data.session){msg=error?error.message:"Turn off 'Confirm email' in Supabase, then try again.";return draw()}
 const r=await fetch("/.netlify/functions/claim-owner",{method:"POST",headers:{authorization:"Bearer "+data.session.access_token,"content-type":"application/json"},body:JSON.stringify({code:$("oc").value.trim()})});
 const j=await r.json().catch(()=>({}));if(!r.ok){msg=j.error||"Could not create the owner account.";await sb.auth.signOut();return draw()}await boot()}
function dash(){const w=CH==="wa",o=M.filter(m=>m.channel===(w?"wa":"email")&&m.direction==="out"),t0=new Date();t0.setHours(0,0,0,0);
 const used=o.filter(m=>(m.status==="sent"||m.status==="ready")&&new Date(m.sent_at||m.created_at)>=t0).length,n=s=>o.filter(m=>m.status===s).length;
 const by=[...new Set(CATS().concat(["Uncategorized"]))].map(c=>`<div class="row"><span>${esc(c)}</span><span>${o.filter(m=>m.category===c).length}</span></div>`).join("");
 return`<div class="c"><h2>Today</h2><div class="bar"><i style="width:${Math.min(100,used/CAP*100)}%"></i></div><p>${used} of ${CAP} used today</p></div><div class="c"><h2>${w?"WhatsApp":"Email"} results</h2><div class="k"><div><b>${n("queued")}</b>Queued</div><div><b>${n(w?"ready":"sending")}</b>${w?"Ready":"Sending"}</div><div><b>${n("sent")}</b>Sent</div><div><b>${n("failed")}</b>Failed</div><div><b>${n("skipped")}</b>Skipped</div></div></div><div class="c"><h2>By category</h2>${by}</div>`}
function contacts(){const f=D.cf||"",l=C.filter(c=>!f||c.category===f);
 return`<div class="c"><h2>Add contact</h2><div class="r"><input id="an" placeholder="Name"><input id="ae" placeholder="Email"><input id="ap" placeholder="WhatsApp phone (01…)"><input id="ac" placeholder="Company"><input id="ak" list="cl" placeholder="Category"><datalist id="cl">${CATS().map(c=>`<option value="${esc(c)}">`).join("")}</datalist></div><button class="b" onclick="addC()">Add contact</button>
 <label>Import (lines: name, email, company, category, phone)</label><textarea id="imp" placeholder="Amina Begum, amina@example.com, Sky Co, Employee, 01712345678"></textarea><button class="b s" onclick="imp()">Import</button><input type="file" accept=".csv,.txt" onchange="impF(this)" style="margin-top:8px"><div class="ok">${esc(msg)}</div></div>
 <div class="c"><h2>Contacts (${l.length})</h2><select onchange="D.cf=this.value;draw()"><option value="">All categories</option>${CATS().map(c=>`<option ${c===f?"selected":""}>${esc(c)}</option>`).join("")}</select>
 ${l.map(c=>`<div class="row"><span>${esc(c.name)} <span class="t">${esc(c.category)}</span>${c.unsubscribed?' <span class="t banned">Opted out</span>':""}<small>${esc(c.email||"no email")} · ${c.phone?"+"+esc(c.phone)+(okP(c.phone)?"":" (check number)"):"no phone"} ${esc(c.company||"")}</small></span><span><button class="b s" onclick="msgTo(${c.id})">Message</button><button class="b d" onclick="unsub(${c.id})">${c.unsubscribed?"Resubscribe":"Unsubscribe"}</button></span></div>`).join("")||"<p>No contacts yet. Add one above.</p>"}</div>`}
function impF(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$("imp").value=r.result};r.readAsText(f)}
async function addC(){const e=$("ae").value.trim().toLowerCase(),p=ph($("ap").value);if(!okE(e)&&p.length<10){msg="Enter a valid email or a WhatsApp phone number.";return draw()}
 const {error}=await sb.from("contacts").insert({name:$("an").value.trim()||e||p,email:okE(e)?e:null,phone:p||null,company:$("ac").value.trim(),category:$("ak").value.trim()||"Uncategorized"});
 msg=error?(error.code==="23505"?"That email already exists.":error.message):"Contact added.";if(!error)logA("Added a contact");await refresh();draw()}
async function imp(){let bad=0,rows=[];const seen=new Set(C.map(c=>c.email).filter(Boolean));
 $("imp").value.split("\n").forEach(l=>{if(!l.trim())return;const p=l.split(",").map(x=>x.trim()),e=(p[1]||"").toLowerCase(),pn=ph(p[4]);if(!okE(e)&&pn.length<10){bad++;return}if(okE(e)){if(seen.has(e))return;seen.add(e)}
  rows.push({name:p[0]||e,email:okE(e)?e:null,company:p[2]||"",category:p[3]||"Uncategorized",phone:pn||null})});
 const {error}=rows.length?await sb.from("contacts").insert(rows):{};msg=error?error.message:`Imported ${rows.length}. Duplicates or invalid rows skipped: ${bad}.`;if(!error)logA("Imported "+rows.length+" contacts");await refresh();draw()}
async function unsub(id){const c=C.find(x=>x.id===id);await sb.from("contacts").update({unsubscribed:!c.unsubscribed}).eq("id",id);await refresh();draw()}
function msgTo(id){const c=C.find(x=>x.id===id);D={mode:"single",to:CH==="wa"?(c.phone||""):(c.email||"")};tab="compose";draw()}
function compose(){const w=CH==="wa",m=D.mode;
 return`<div class="c"><h2>Write a ${w?"WhatsApp message":"email"}</h2>${w?'<div class="m">Messages appear in History as Ready. Tap Open chat to send each one from WhatsApp. Automatic sending needs the WhatsApp Business Platform (next step).</div>':`<div class="m">Emails send automatically from ${esc(CFG.FROM_EMAIL)}, up to ${CAP} a day. Extra emails go out the next day.</div>`}
 <div class="r"><button class="b ${m==="single"?"":"s"}" onclick="D.mode='single';draw()">One person</button><button class="b ${m==="bulk"?"":"s"}" onclick="D.mode='bulk';draw()">Many people</button></div>
 ${m==="single"?`<label>To (type any ${w?"WhatsApp number":"email address"})</label><input id="to" list="dl" value="${esc(D.to||"")}"><datalist id="dl">${C.map(c=>w?(c.phone?`<option value="${esc(c.phone)}">${esc(c.name)}</option>`:""):(c.email?`<option value="${esc(c.email)}">${esc(c.name)}</option>`:"")).join("")}</datalist>`
 :`<label>Send to</label><select id="grp"><option value="*">All contacts</option>${CATS().map(c=>`<option>${esc(c)}</option>`).join("")}</select>`}
 ${w?"":`<label>Subject</label><input id="sj" value="${esc(D.sj||"")}">`}<label>Message (use {{name}} and {{company}})</label><textarea id="bd">${esc(D.bd||"")}</textarea>
 ${w?`<label>Link (optional)</label><input id="bl" value="${esc(D.bl||"")}" placeholder="https://">`:`<div class="r"><div><label>Button text</label><input id="bt" value="${esc(D.bt||"Learn More")}"></div><div><label>Button link (website or landing page)</label><input id="bl" value="${esc(D.bl||"")}" placeholder="https://"></div></div>`}
 <label>When</label><div class="r"><select id="wh" onchange="$('dt').style.display=this.value==='later'?'block':'none'"><option value="now">Send now</option><option value="later">Schedule</option></select><input id="dt" type="datetime-local" style="display:none"></div>
 <button class="b" style="${w?"background:#25D366":""}" onclick="send()">${w?"Queue messages":"Send"}</button><button class="b s" onclick="D.sj=TPL[0];D.bd=TPL[1];D.bl=D.bl||'https://eservicebook.com.bd';draw()">Insert example</button><div class="ok">${esc(msg)}</div></div>`}
async function send(){const w=CH==="wa",bd=$("bd").value.trim(),bl=$("bl").value.trim(),sj=w?"":$("sj").value.trim();
 if(!bd||(!w&&!sj)){msg="Add "+(w?"a message":"a subject and a message")+" first.";return draw()}
 if(bl&&!/^https?:\/\//.test(bl)){msg="The link must start with https://";return draw()}
 let to;if(D.mode==="single"){const v=$("to").value.trim(),k=w?ph(v):v.toLowerCase();if(w?k.length<10:!okE(k)){msg="Enter a valid "+(w?"WhatsApp number.":"email address.");return draw()}
  to=[C.find(c=>w?c.phone===k:c.email===k)||{name:k,email:w?null:k,phone:w?k:null,category:"Uncategorized"}]}
 else{const g=$("grp").value;to=C.filter(c=>(w?c.phone&&okP(c.phone):c.email)&&!c.unsubscribed&&(g==="*"||c.category===g))}
 if(!to.length){msg="No recipients. Opted-out contacts are skipped.";return draw()}
 const at=$("wh").value==="later"&&$("dt").value?new Date($("dt").value).toISOString():new Date().toISOString();
 const rows=to.map(c=>({channel:w?"wa":"email",to_addr:w?c.phone:c.email,name:c.name,category:c.category,from_addr:CFG.FROM_EMAIL,subject:sj.replace(/{{name}}/g,c.name||""),body:bd.replace(/{{name}}/g,c.name||"").replace(/{{company}}/g,c.company||"your organization")+(w&&bl?"\n"+bl:""),btn_text:w?null:$("bt").value,btn_link:w?null:bl,send_at:at}));
 const {error}=await sb.rpc("queue_messages",{rows});if(error){msg=error.message;return draw()}
 msg=rows.length+" message(s) queued. "+(w?"Open them from History.":"They send automatically.");D={mode:D.mode};await refresh();draw()}
function hist(){const f=D.hf||"",l=M.filter(m=>m.channel===(CH==="wa"?"wa":"email")&&(m.status!=="queued"||new Date(m.send_at)<=new Date())&&(!f||m.category===f));
 return`<div class="c"><h2>${CH==="wa"?"WhatsApp":"Email"} history by category</h2><select onchange="D.hf=this.value;draw()"><option value="">All categories</option>${[...new Set(CATS().concat(["Uncategorized"]))].map(c=>`<option ${c===f?"selected":""}>${esc(c)}</option>`).join("")}</select>
 <button class="b s" onclick="refresh().then(draw)">Refresh</button>
 ${l.map(m=>`<div class="row"><span><b>${esc(m.subject||(m.body||"").slice(0,40))}</b><small>${esc(m.name||"")} · ${esc(m.to_addr)} · ${esc(m.category)} · ${new Date(m.created_at).toLocaleString()}${m.error?" · "+esc(m.error):""}</small></span><span>${m.status==="ready"?`<button class="b" style="background:#25D366;margin:0" onclick="waOpen(${m.id})">Open chat</button>`:`<span class="t ${m.status}">${esc(m.status)}</span>`}</span></div>`).join("")||"<p>Nothing here yet. Send a message from Compose.</p>"}</div>`}
async function waOpen(id){const m=M.find(x=>x.id===id);window.open("https://wa.me/"+m.to_addr+"?text="+encodeURIComponent(m.body),"_blank","noopener");await sb.from("messages").update({status:"sent",sent_at:new Date().toISOString()}).eq("id",id);await refresh();draw()}
function sched(){const l=M.filter(m=>m.status==="queued"&&new Date(m.send_at)>new Date()).sort((a,b)=>new Date(a.send_at)-new Date(b.send_at));
 return`<div class="c"><h2>Scheduled (${l.length})</h2>${l.map(m=>`<div class="row"><span><b>${esc(m.subject||(m.body||"").slice(0,40))}</b><small>${m.channel==="wa"?"WhatsApp":"Email"} to ${esc(m.to_addr)} · sends ${new Date(m.send_at).toLocaleString()}</small></span><button class="b d" onclick="cancelM(${m.id})">Cancel</button></div>`).join("")||"<p>Nothing scheduled. Choose Schedule in Compose.</p>"}</div>`}
async function cancelM(id){await sb.from("messages").update({status:"cancelled"}).eq("id",id).eq("status","queued");await refresh();draw()}
function users(){const own=ME.role==="super";
 return`<div class="c"><h2>Users and roles</h2><div class="m">${own?"You are the owner: give the Admin role, ban and reactivate accounts.":"Admins can reactivate banned accounts."}</div>${U.map(u=>`<div class="row"><span><b>${esc(u.name)}</b> ${tag(u)}${u.status==="banned"?' <span class="t banned">Banned</span>':""}<small>@${esc(u.username)} · joined ${new Date(u.created_at).toLocaleDateString()}</small></span><span>${u.role==="super"?"":(own?`<select style="width:auto" onchange="act('set_role',{uid:'${u.id}',new_role:this.value})"><option value="user" ${u.role==="user"?"selected":""}>User</option><option value="admin" ${u.role==="admin"?"selected":""}>Admin</option></select> `:"")+(u.status==="banned"?`<button class="b s" onclick="act('set_status',{uid:'${u.id}',new_status:'active'})">Reactivate</button>`:(own?`<button class="b d" onclick="act('set_status',{uid:'${u.id}',new_status:'banned'})">Ban</button>`:""))}</span></div>`).join("")}</div>`}
async function act(fn,a){const {error}=await sb.rpc(fn,a);if(error)alert(error.message);await refresh();draw()}
function log(){return`<div class="c"><h2>Activity log</h2>${L.map(x=>`<div class="row"><span>${esc(x.action)}<small>@${esc(x.username||"-")} · ${new Date(x.at).toLocaleString()}</small></span></div>`).join("")||"<p>No activity yet.</p>"}</div>`}
function help(){return`<div class="c"><h2>Training and guidelines</h2><div class="row"><span><b>Who can do what</b><small>User: contacts and single messages. Admin: bulk sending, activity log, reactivating accounts. Owner (supreme-admin): everything, including roles and bans.</small></span></div><div class="row"><span><b>Send safely</b><small>Message only people who agreed to hear from you. Keep to ${CAP} a day. Every email has an unsubscribe link. For WhatsApp, let people opt out and use the official WhatsApp Business Platform for automatic bulk sending.</small></span></div></div><div class="c"><h2>Support</h2><a class="b" style="display:inline-block;background:#25D366;text-decoration:none;border-radius:8px;padding:9px 14px;color:#fff" href="${$("wa").href}" target="_blank" rel="noopener">Chat with support on WhatsApp</a></div>`}
setInterval(()=>{if(ME&&(tab==="hist"||tab==="sched"||tab==="dash"))refresh().then(draw)},60000);
init();
</script></body></html>
