<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>E-Service Book Email Platform</title>
<style>
:root{--brand:#0B3C26;--gd:#B58922;--bg:#f4f7f5;--card:#fff;--tx:#1b1f24;--mu:#66707a;--bd:#d9e0dc;--ac:var(--brand);--ok:#1a7f37;--wa:#b45309;--er:#c0392b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121715;--card:#1a211e;--tx:#e8eeea;--mu:#93a09a;--bd:#2c3631;--ok:#3fb950;--wa:#e3a008;--er:#f47067;--ac:#4fae80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121715;--card:#1a211e;--tx:#e8eeea;--mu:#93a09a;--bd:#2c3631;--ok:#3fb950;--wa:#e3a008;--er:#f47067;--ac:#4fae80;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{padding:12px 16px;background:var(--brand);color:#fff;display:flex;align-items:center;gap:12px}header img{max-height:42px;display:block}h1{font:600 18px Fraunces,Georgia,serif;margin:0}header p{margin:2px 0 0;opacity:.85;font-size:13px}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 16px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:7px 12px;border-radius:18px;font:inherit;cursor:pointer}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
main{padding:8px 16px 40px;max-width:900px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}.grid .card{margin:0}
.stat b{display:block;font-size:22px}.stat span{color:var(--mu);font-size:12px}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
input[type=checkbox]{width:auto}input[type=color]{padding:2px;height:38px}
textarea{min-height:110px;resize:vertical}
.btn{border:0;background:var(--ac);color:#fff;padding:9px 14px;border-radius:8px;font:inherit;cursor:pointer;margin-top:10px}
.btn.g{background:transparent;color:var(--ac);border:1px solid var(--bd)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1 1 140px}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-weight:600}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;border:1px solid var(--bd)}
.sent,.delivered{color:var(--ok)}.scheduled{color:var(--wa)}.failed,.skipped,.bounced{color:var(--er)}
.note{color:var(--mu);font-size:12px;margin:6px 0 0}
.pick{max-height:170px;overflow:auto;border:1px solid var(--bd);border-radius:8px;padding:6px;margin-top:4px}
.pick label{display:flex;gap:8px;align-items:center;margin:3px 0;color:var(--tx);font-size:13px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn:not(.g),:root:not([data-theme="light"]) nav button.on{color:#04120b}}
:root[data-theme="dark"] .btn:not(.g),:root[data-theme="dark"] nav button.on{color:#04120b}
.toast{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:11px 14px;border-radius:10px;z-index:20;font-size:14px}
.al{padding:9px 0;border-bottom:1px solid var(--bd)}.al.u{font-weight:600}
.pv{background:#e9ecef;border-radius:10px;padding:12px;overflow-x:auto}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
<header><span id="hl"></span><div><h1 id="bn">E-Service Book Email Platform</h1><p>Contacts, campaigns, alerts and unsubscribe</p></div></header>
<nav id="nav"></nav>
<main id="app"></main>
<script>
var CATS;
var EX={subject:'Welcome to E-Service Book, {{name}}',body:'Dear {{name}},\n\nYour digital service book is ready. You can now view and update your service records online, any time.\n\nIf you need any help, just reply to this email and our team will assist you.',btnText:'Open E-Service Book',btnUrl:'https://eservicebook.com.bd',img:''};
var S={contacts:[],senders:['info@eservicebook.com.bd'],templates:[{id:1,name:'Example: Welcome',subject:EX.subject,body:EX.body,btnText:EX.btnText,btnUrl:EX.btnUrl,img:''}],outbox:[],batches:{},cap:300,cats:['student','employee','employer','other'],notifs:[],sig:'',replyTo:'',lastSender:'',live:false,since:0,brand:{name:'E-Service Book',logo:'',p:'#0B3C26',a:'#B58922'}};
var view='dash',filter='all',cq='',exp='',nid=100,pend=null,viewing=null,draft={img:''},lastImp='';
try{var raw=localStorage.getItem('esb_email_v2');if(raw){var o=JSON.parse(raw);S=Object.assign(S,o);S.brand=Object.assign({name:'E-Service Book',logo:'',p:'#0B3C26',a:'#B58922'},o.brand||{});if(S.brand.p==='#0b6e4f')S.brand.p='#0B3C26';if(S.brand.a==='#f2a900')S.brand.a='#B58922'}}catch(e){}
S.outbox.forEach(function(o){if(o.status==='sending'){o.status='failed';o.note='interrupted, check before resending'}});
CATS=S.cats;[].concat(S.outbox,S.templates,S.notifs).forEach(function(x){if(x.id>=nid)nid=x.id+1});
function save(){try{localStorage.setItem('esb_email_v2',JSON.stringify(S))}catch(e){alert('Storage is full. Use a smaller image.')}}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function v(id){var e=document.getElementById(id);return e?e.value:''}
function day(t){return new Date(t).toDateString()}
function fmt(t){return t?new Date(t).toLocaleString([], {dateStyle:'medium',timeStyle:'short'}):'-'}
function fill(t,c){return String(t||'').replace(/\{\{name\}\}/g,c.name||'').replace(/\{\{email\}\}/g,c.email||'').replace(/\{\{company\}\}/g,c.company||'')}
function okMail(e){return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)}
function sentToday(){return S.outbox.filter(function(o){return o.sentAt&&day(o.sentAt)===day(Date.now())}).length}
function applyBrand(){document.documentElement.style.setProperty('--brand',S.brand.p);document.getElementById('bn').textContent=S.brand.name+' Email Platform';document.getElementById('hl').innerHTML=S.brand.logo?'<img src="'+S.brand.logo+'" alt="">':''}

function build(d,c){
  var b=S.brand,logo=b.logo?'<img src="'+b.logo+'" alt="" style="max-height:44px">':'<strong style="font-size:20px;color:#fff">'+esc(b.name)+'</strong>';
  return '<div style="max-width:560px;margin:0 auto;font-family:Arial,sans-serif;background:#fff;color:#222;border:1px solid #ddd;border-radius:8px;overflow:hidden"><div style="background:'+b.p+';padding:16px 20px">'+logo+'</div><div style="padding:20px;line-height:1.55">'
   +(d.img?'<img src="'+d.img+'" alt="" style="max-width:100%;border-radius:6px;margin-bottom:14px">':'')
   +'<div style="white-space:pre-wrap">'+esc(fill(d.body,c))+'</div>'+(S.sig?'<div style="white-space:pre-wrap;margin-top:14px;color:#555">'+esc(S.sig)+'</div>':'')
   +(d.btnText?'<p><a href="'+esc(d.btnUrl||'#')+'" style="display:inline-block;background:'+b.a+';color:#1b1f24;padding:11px 20px;border-radius:6px;text-decoration:none;font-weight:bold">'+esc(d.btnText)+'</a></p>':'')
   +'</div><div style="background:#f3f4f6;color:#666;font-size:12px;padding:14px 20px">'+esc(b.name)+' &middot; Sent to '+esc(c.email)+'<br><a href="{{unsub}}" style="color:'+b.p+'">Unsubscribe</a> from marketing emails at any time.</div></div>';
}
var busy=false;
function tick(){if(S.live)liveSend();else demoTick()}
async function liveSend(){
  if(busy)return;busy=true;
  try{
    var left=S.cap-sentToday(),due=S.outbox.filter(function(o){return o.status==='scheduled'&&o.when<=Date.now()});
    for(var i=0;i<due.length&&left>0;i++){
      var o=due[i],c=S.contacts.find(function(x){return x.email===o.to});
      if(c&&c.unsub){o.status='skipped';o.note='unsubscribed';save();continue}
      o.status='sending';save();
      var r=await fetch('/.netlify/functions/send',{method:'POST',headers:{'content-type':'application/json','x-admin-token':S.token||''},body:JSON.stringify({id:o.id,to:o.to,from:o.sender,replyTo:o.replyTo||undefined,subject:o.subject,html:build(S.batches[o.bid],c||{name:'',email:o.to,company:''})})}).then(function(x){return x.json().then(function(j){return {ok:x.ok,j:j}})}).catch(function(){return {ok:false,j:{}}});
      if(r.ok&&r.j.status==='sent'){o.status='sent';o.sentAt=Date.now();left--}
      else if(r.ok&&r.j.status==='skipped'){o.status='skipped';o.note=r.j.note||''}
      else if(r.ok&&r.j.status==='failed'){o.status='failed';o.note=r.j.note||'';o.sentAt=Date.now();left--}
      else{o.status='scheduled';save();toast('Sending paused: '+(r.j.error||'cannot reach the server'));break}
      save();await new Promise(function(z){setTimeout(z,700)});
    }
  }finally{busy=false;if(view==='dash'||view==='hist')render()}
}
function demoTick(){
  var ch=false,left=S.cap-sentToday(),now=Date.now();
  S.outbox.forEach(function(o){
    if(o.status==='scheduled'&&o.when<=now&&left>0){
      var c=S.contacts.find(function(x){return x.email===o.to});
      if(c&&c.unsub){o.status='skipped';o.note='unsubscribed'}else{o.status='sent';o.sentAt=now;left--}
      ch=true;
    }
  });
  if(ch){save();if(view==='dash'||view==='hist')render()}
}
setInterval(tick,15000);

function unread(){return S.notifs.filter(function(n){return !n.read}).length}
function nav(){
  var u=unread(),t={dash:'Status',contacts:'Contacts',compose:'Campaign',tpl:'Templates',hist:'Archive',alerts:'Alerts'+(u?' ('+u+')':''),set:'Settings'};
  document.getElementById('nav').innerHTML=Object.keys(t).map(function(k){return '<button class="'+(view===k?'on':'')+'" onclick="go(\''+k+'\')">'+t[k]+'</button>'}).join('');
}
function go(x){view=x;render()}

function dash(){
  var n=function(s){return S.outbox.filter(function(o){return o.status===s}).length},sum=function(k){return S.outbox.reduce(function(a,o){return a+(o[k]||0)},0)};
  var st=function(b,l){return '<div class="card stat"><b>'+b+'</b><span>'+l+'</span></div>'},pct=Math.min(100,Math.round(sentToday()/S.cap*100));
  var h='<div class="card"><h2>Today</h2><div style="height:8px;background:var(--bd);border-radius:6px"><div style="height:8px;width:'+pct+'%;background:var(--ac);border-radius:6px"></div></div><p class="note">'+sentToday()+' of '+S.cap+' daily sends used</p></div>';
  h+='<div class="grid">'+st(n('scheduled'),'Queued')+st(n('sent'),'Sent')+st(n('delivered'),'Delivered')+st(n('bounced'),'Bounced')+st(n('failed'),'Failed')+'</div>';
  h+='<div class="grid" style="margin-top:10px">'+st(sum('opens'),'Opens')+st(sum('clicks'),'Clicks')+st(S.outbox.filter(function(o){return o.replied}).length,'Replies')+st(S.contacts.filter(function(c){return !c.unsub}).length,'Active contacts')+st(S.contacts.filter(function(c){return c.unsub}).length,'Unsubscribed')+'</div>';
  h+='<div class="card" style="margin-top:12px"><h2>Queued and scheduled</h2>'+tbl(S.outbox.filter(function(o){return o.status==='scheduled'}).slice(0,20),'q')+'</div>';
  return h+'<p class="note">Queued emails are processed while this page is open.</p>';
}
function tbl(list,mode){
  if(!list.length)return '<p class="note">Nothing here yet.</p>';
  var B=function(l,f){return '<button class="btn g" style="margin:0 4px 0 0;padding:5px 9px" onclick="'+f+'">'+l+'</button>'};
  var hd='<tr><th>To</th><th>Category</th><th>From</th><th>Subject</th><th>'+(mode==='q'?'Scheduled for':'When')+'</th><th>Status</th>'+(mode==='h'?'<th>Engagement</th>':'')+(mode?'<th></th>':'')+'</tr>';
  return '<div class="sc"><table>'+hd+list.map(function(o){
    var s=o.status==='scheduled'?'queued':o.status;
    var st=mode==='h'&&o.status!=='skipped'?'<select style="width:auto" onchange="setSt('+o.id+',this.value)">'+['sent','delivered','bounced','failed'].map(function(x){return '<option '+(o.status===x?'selected':'')+'>'+x+'</option>'}).join('')+'</select>':s+(o.note?' ('+esc(o.note)+')':'');
    var eng=mode==='h'?'<td>'+(o.opens||0)+' opens, '+(o.clicks||0)+' clicks'+(o.replied?', replied':'')+'</td>':'';
    var act=mode==='q'?'<td>'+B('Send now','sendNow('+o.id+')')+B('Cancel','cancelQ('+o.id+')')+'</td>':mode==='h'?'<td>'+B('View','viewing='+o.id+';render()')+(o.status!=='skipped'?B('Opened','addEvent('+o.id+',\'open\')')+B('Replied','addEvent('+o.id+',\'reply\')'):'')+'</td>':'';
    return '<tr><td>'+esc(o.to)+'</td><td><span class="tag">'+esc(o.cat)+'</span></td><td>'+esc(o.sender)+'</td><td>'+esc(o.subject)+'</td><td>'+fmt(o.sentAt||o.when)+'</td><td class="'+o.status+'">'+st+'</td>'+eng+act+'</tr>'}).join('')+'</table></div>';
}
function toast(t){var e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(function(){e.remove()},4500)}
function askPerm(){try{Notification.requestPermission().then(function(){render()})}catch(e){toast('Device notifications are not available here')}}
function addEvent(id,type,txt){
  var o=S.outbox.find(function(x){return x.id===id});if(!o)return;
  if(type==='open')o.opens=(o.opens||0)+1;
  if(type==='click')o.clicks=(o.clicks||0)+1;
  if(type==='reply')o.replied=true;
  if(type==='bounce')o.status='bounced';
  if(type==='delivered'&&o.status==='sent')o.status='delivered';
  var m={open:o.to+' opened your email',click:o.to+' clicked a link in your email',reply:o.to+' replied to your email',bounce:'Email to '+o.to+' bounced',delivered:'Email to '+o.to+' was delivered'}[type]||(o.to+': '+type);
  var n={id:nid++,type:type,at:Date.now(),text:m+(txt?' - '+txt:'')+' ('+o.subject+')',read:false};
  S.notifs.unshift(n);S.notifs=S.notifs.slice(0,200);save();toast(m);
  try{if(window.Notification&&Notification.permission==='granted')new Notification(S.brand.name,{body:m})}catch(e){}
  render();
}
function poll(){
  if(!S.live)return;
  fetch('/.netlify/functions/events?since='+(S.since||0),{headers:{'x-admin-token':S.token||''}}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(a){
    (a||[]).forEach(function(e){
      S.since=Math.max(S.since||0,e.at||0);
      if(e.type==='unsub'){var c=S.contacts.find(function(x){return x.email===e.email});if(c&&!c.unsub){c.unsub=true;S.notifs.unshift({id:nid++,type:'unsub',at:Date.now(),text:e.email+' unsubscribed',read:false});toast(e.email+' unsubscribed')}}
      else addEvent(e.outboxId,e.type,e.text);
    });
    save();
  }).catch(function(){});
}
setInterval(poll,30000);
function alerts(){
  var perm=window.Notification?Notification.permission:'unavailable';
  var h='<div class="card"><h2>Alerts</h2><p class="note">You get an alert when someone opens, clicks or replies, and when an email bounces.</p><div class="row"><button class="btn" onclick="askPerm()">Device notifications: '+perm+'</button><button class="btn g" onclick="S.notifs.forEach(function(n){n.read=true});save();render()">Mark all read</button></div><p class="note">Automatic open and reply detection needs the Netlify tracking and inbound-reply functions (Part 2). Until then, tap Opened or Replied on a row in the Archive to log it; alerts then work exactly the same.</p></div>';
  h+='<div class="card">'+(S.notifs.length?S.notifs.map(function(n){return '<div class="al '+(n.read?'':'u')+'">'+esc(n.text)+'<div class="note">'+fmt(n.at)+'</div></div>'}).join(''):'<p class="note">No alerts yet.</p>')+'</div>';
  S.notifs.forEach(function(n){n.read=true});save();
  return h;
}
function sendNow(id){var o=S.outbox.find(function(x){return x.id===id});if(o){o.when=Date.now();save();tick();render()}}
function cancelQ(id){if(confirm('Cancel this queued email?')){S.outbox=S.outbox.filter(function(x){return x.id!==id});save();render()}}
function setSt(id,s){var o=S.outbox.find(function(x){return x.id===id});if(o){o.status=s;save()}}

function contacts(){
  var list=S.contacts.filter(function(c){return (filter==='all'||(filter==='unsub'?c.unsub:c.cat===filter))&&(!cq||(c.name+' '+c.email+' '+c.company).toLowerCase().indexOf(cq.toLowerCase())>-1)});
  var h=expCard()+'<div class="card"><h2>Import from Excel or CSV</h2><input type="file" accept=".csv,.xlsx,.xls" onchange="onFile(this)"><p class="note">Columns: name, email, company, category (header row optional). Duplicates are detected and skipped.</p><label>Or paste rows</label><textarea id="csv" placeholder="Rahim Uddin,rahim@example.com,ABC Ltd,student"></textarea><button class="btn" onclick="importRows(v(\'csv\').split(/\\r?\\n/).map(function(l){return l.split(\',\')}))">Import pasted rows</button>'+(lastImp?'<p class="note">'+lastImp+'</p>':'')+'</div>';
  h+='<div class="card"><h2>Add contact</h2><div class="row"><div><label>Name</label><input id="cn"></div><div><label>Email</label><input id="ce" type="email"></div><div><label>Company</label><input id="cp"></div><div><label>Category</label><select id="cc">'+CATS.map(function(c){return '<option>'+c+'</option>'}).join('')+'</select></div></div><button class="btn" onclick="addC()">Add</button></div>';
  h+='<div class="card"><h2>Contacts ('+list.length+')</h2><div class="row"><input placeholder="Search name, email, company" value="'+esc(cq)+'" onchange="cq=this.value;render()"><button class="btn g" style="margin:0" onclick="exportCsv(\'contacts\')">Export CSV</button></div><select style="margin-top:8px" onchange="filter=this.value;render()"><option value="all">All</option>'+CATS.map(function(c){return '<option '+(filter===c?'selected':'')+'>'+c+'</option>'}).join('')+'<option value="unsub" '+(filter==='unsub'?'selected':'')+'>Unsubscribed</option></select>';
  h+=list.length?'<div class="sc"><table><tr><th>Name</th><th>Email</th><th>Company</th><th>Category</th><th></th></tr>'+list.map(function(c){
    return '<tr><td>'+esc(c.name)+'</td><td>'+esc(c.email)+'</td><td>'+esc(c.company)+'</td><td><span class="tag">'+esc(c.cat)+'</span></td><td><button class="btn g" style="margin:0" onclick="unsub(\''+esc(c.email)+'\')">'+(c.unsub?'Resubscribe':'Unsubscribe')+'</button> <button class="btn g" style="margin:0" onclick="del(\''+esc(c.email)+'\')">Delete</button></td></tr>'}).join('')+'</table></div>':'<p class="note">No contacts yet.</p>';
  return h+'</div>';
}
function addContact(n,e,co,c){
  e=(e||'').trim().toLowerCase();
  if(!okMail(e))return 'invalid';
  if(S.contacts.some(function(x){return x.email===e}))return 'dup';
  c=(c||'').trim().toLowerCase();
  S.contacts.push({name:(n||'').trim(),email:e,company:(co||'').trim(),cat:CATS.indexOf(c)>-1?c:'other',unsub:false});return 'ok';
}
function addC(){var r=addContact(v('cn'),v('ce'),v('cp'),v('cc'));if(r==='ok'){save();render()}else alert(r==='dup'?'This email is already in your contacts.':'Enter a valid email address.')}
function importRows(rows){
  rows=rows.filter(function(r){return r.join('').trim()});
  var m={name:0,email:1,company:2,cat:3},h=rows[0]||[];
  if(h.some(function(x){return /^e-?mail$/i.test(String(x).trim())})){
    h.forEach(function(x,i){x=String(x).trim().toLowerCase();if(/^e-?mail/.test(x))m.email=i;else if(/name/.test(x)&&!/company/.test(x))m.name=i;else if(/company|org/.test(x))m.company=i;else if(/cat|type/.test(x))m.cat=i});rows=rows.slice(1);
  }
  var ok=0,dup=[],bad=0;
  rows.forEach(function(r){var res=addContact(r[m.name],r[m.email],r[m.company],r[m.cat]);if(res==='ok')ok++;else if(res==='dup')dup.push(String(r[m.email]).trim());else bad++});
  lastImp=ok+' added, '+dup.length+' duplicate'+(dup.length===1?'':'s')+' skipped'+(dup.length?' ('+esc(dup.slice(0,5).join(', '))+(dup.length>5?'...':'')+')':'')+', '+bad+' invalid.';
  save();render();
}
function onFile(inp){
  var f=inp.files[0];if(!f)return;var csv=/\.csv$/i.test(f.name),r=new FileReader();
  r.onload=function(){try{var wb=XLSX.read(r.result,{type:csv?'string':'array'});importRows(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''}))}catch(e){alert('Could not read this file.')}};
  if(csv)r.readAsText(f);else r.readAsArrayBuffer(f);
}
function expCard(){return exp?'<div class="card"><h2>Export</h2><textarea id="ex" readonly>'+esc(exp)+'</textarea><div class="row"><button class="btn" onclick="cp()">Copy</button><button class="btn g" onclick="exp=\'\';render()">Close</button></div></div>':''}
function cp(){var t=document.getElementById('ex');t.select();try{navigator.clipboard.writeText(t.value)}catch(e){try{document.execCommand('copy')}catch(x){}}toast('Copied')}
function exportCsv(k){
  var q=function(x){return '"'+String(x==null?'':x).replace(/"/g,'""')+'"'},rows;
  if(k==='contacts')rows=[['name','email','company','category','unsubscribed']].concat(S.contacts.map(function(c){return [c.name,c.email,c.company,c.cat,c.unsub?'yes':'no']}));
  else rows=[['to','category','from','subject','status','sent_at','opens','clicks','replied']].concat(S.outbox.filter(function(o){return o.status!=='scheduled'}).map(function(o){return [o.to,o.cat,o.sender,o.subject,o.status,o.sentAt?new Date(o.sentAt).toISOString():'',o.opens||0,o.clicks||0,o.replied?'yes':'no']}));
  exp=rows.map(function(r){return r.map(q).join(',')}).join('\n');render();
}
function unsub(e){var c=S.contacts.find(function(x){return x.email===e});c.unsub=!c.unsub;save();render()}
function del(e){S.contacts=S.contacts.filter(function(x){return x.email!==e});save();render()}

function compose(){
  var h='<div class="card"><h2>New campaign</h2><label>Send to</label><select id="mode" onchange="modeChg()"><option value="type">Type email address(es)</option><option value="pick">Choose from contacts</option><option value="cat">A category</option><option value="all">All active contacts</option></select>'
   +'<div id="m_type"><label>Recipient email(s)</label><input id="to" type="text" inputmode="email" autocomplete="off" placeholder="Type any email, separate several with commas"></div>'
   +'<div id="m_pick" style="display:none"><div class="pick">'+(S.contacts.filter(function(c){return !c.unsub}).map(function(c){return '<label><input type="checkbox" class="pk" value="'+esc(c.email)+'">'+esc(c.name||c.email)+' <span class="note">'+esc(c.email)+'</span></label>'}).join('')||'<p class="note">No contacts yet.</p>')+'</div></div>'
   +'<div id="m_cat" style="display:none"><label>Category</label><select id="cat">'+CATS.map(function(c){return '<option>'+c+'</option>'}).join('')+'</select></div>'
   +'<label>Send from (type any sender address)</label><input id="snd" type="text" inputmode="email" autocomplete="off" list="sl" value="'+esc(S.lastSender||S.senders[0]||'')+'" placeholder="sender@eservicebook.com.bd"><datalist id="sl">'+S.senders.map(function(x){return '<option value="'+esc(x)+'">'}).join('')+'</datalist>'
   +'<div class="row"><button class="btn g" onclick="loadD(EX)">Use example email</button><select id="tp" onchange="useTpl()" style="margin-top:10px"><option value="">Load a template...</option>'+S.templates.map(function(t){return '<option value="'+t.id+'">'+esc(t.name)+'</option>'}).join('')+'</select></div>'
   +'<label>Subject</label><input id="sub" oninput="prev()"><label>Message (use {{name}}, {{company}})</label><textarea id="body" oninput="prev()"></textarea>'
   +'<div class="row"><div><label>Button text (optional)</label><input id="btnT" oninput="prev()"></div><div><label>Button link</label><input id="btnU" oninput="prev()" placeholder="https://"></div></div>'
   +'<label>Image (optional)</label><input type="file" accept="image/*" onchange="pickImg(this)">'
   +'<label>Schedule</label><select id="sch" onchange="document.getElementById(\'when\').style.display=this.value==\'custom\'?\'block\':\'none\'"><option value="now">Send now</option><option value="1h">In 1 hour</option><option value="tm">Tomorrow 9:00 AM</option><option value="custom">Pick date and time</option></select><input id="when" type="datetime-local" style="display:none">'
   +'<div class="row"><button class="btn" onclick="queue()">Send / schedule</button><button class="btn g" onclick="saveTpl()">Save as template</button></div></div>'
   +'<div class="card"><h2>Preview</h2><div class="pv" id="pv"></div></div>';
  return h;
}
function modeChg(){['type','pick','cat'].forEach(function(k){document.getElementById('m_'+k).style.display=v('mode')===k?'block':'none'})}
function getD(){return {subject:v('sub'),body:v('body'),btnText:v('btnT'),btnUrl:v('btnU'),img:draft.img}}
function prev(){var e=document.getElementById('pv');if(e)e.innerHTML=build(getD(),{name:'Rahim Uddin',email:'rahim@example.com',company:'ABC Ltd'})}
function loadD(d){draft.img=d.img||'';document.getElementById('sub').value=d.subject||'';document.getElementById('body').value=d.body||'';document.getElementById('btnT').value=d.btnText||'';document.getElementById('btnU').value=d.btnUrl||'';prev()}
function useTpl(){var t=S.templates.find(function(x){return String(x.id)===v('tp')});if(t)loadD(t)}
function shrink(f,max,cb){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var k=Math.min(1,max/im.width),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL(f.type==='image/png'?'image/png':'image/jpeg',0.8))};im.src=r.result};r.readAsDataURL(f)}
function pickImg(i){if(i.files[0])shrink(i.files[0],560,function(u){draft.img=u;prev()})}
function saveTpl(){var d=getD(),n=prompt('Template name?');if(!n)return;S.templates.push(Object.assign({id:nid++,name:n},d));save();alert('Template saved.')}
function whenTs(){var x=v('sch');if(x==='now')return Date.now();if(x==='1h')return Date.now()+3600000;if(x==='tm'){var d=new Date();d.setDate(d.getDate()+1);d.setHours(9,0,0,0);return d.getTime()}return v('when')?new Date(v('when')).getTime():NaN}
function queue(){
  var m=v('mode'),d=getD(),rec=[],snd=v('snd').trim().toLowerCase(),find=function(e){return S.contacts.find(function(x){return x.email===e})||{name:'',email:e,company:'',cat:'other'}};
  if(!okMail(snd)){alert('Type a valid sender email address.');return}
  if(!d.subject.trim()||!d.body.trim()){alert('Add a subject and a message.');return}
  if(m==='type'){var es=v('to').split(/[\s,;]+/).filter(Boolean);if(!es.length||es.some(function(e){return !okMail(e.toLowerCase())})){alert('Type one or more valid recipient email addresses.');return}rec=es.map(function(e){return find(e.toLowerCase())})}
  else if(m==='pick')rec=[].slice.call(document.querySelectorAll('.pk:checked')).map(function(x){return find(x.value)});
  else rec=S.contacts.filter(function(c){return !c.unsub&&(m==='all'||c.cat===v('cat'))});
  if(!rec.length){alert('No recipients selected.');return}
  var when=whenTs();if(isNaN(when)){alert('Pick a date and time.');return}
  var left=S.cap-sentToday()-S.outbox.filter(function(o){return o.status==='scheduled'}).length;
  if(rec.length>left&&!confirm('Only '+Math.max(left,0)+' more can go out today under the daily cap of '+S.cap+'. The rest will wait until tomorrow. Continue?'))return;
  if(S.senders.indexOf(snd)<0&&S.senders.length<5)S.senders.push(snd);
  S.lastSender=snd;var bid='b'+nid++;S.batches[bid]=d;
  rec.forEach(function(c){S.outbox.push({id:nid++,bid:bid,to:c.email,cat:c.cat,sender:snd,replyTo:S.replyTo,subject:fill(d.subject,c),when:when,status:'scheduled'})});
  save();tick();alert(rec.length+' email(s) queued.');go('dash');
}
function tpl(){
  return '<div class="card"><h2>Templates</h2><p class="note">Create a design in Campaign, then tap Save as template. Logo and colors are in Settings.</p></div>'+S.templates.map(function(t){
    return '<div class="card"><h2>'+esc(t.name)+'</h2><div class="pv">'+build(t,{name:'Rahim Uddin',email:'rahim@example.com',company:'ABC Ltd'})+'</div><div class="row"><button class="btn" onclick="pend=S.templates.find(function(x){return x.id=='+t.id+'});go(\'compose\')">Use</button><button class="btn g" onclick="S.templates=S.templates.filter(function(x){return x.id!=='+t.id+'});save();render()">Delete</button></div></div>'}).join('');
}
function hist(){
  var list=S.outbox.filter(function(o){return o.status!=='scheduled'&&(filter==='all'||o.cat===filter)}).slice().reverse(),h=expCard();
  if(viewing){var o=S.outbox.find(function(x){return x.id===viewing});if(o&&S.batches[o.bid])h+='<div class="card"><h2>'+esc(o.subject)+'</h2><div class="pv">'+build(S.batches[o.bid],S.contacts.find(function(x){return x.email===o.to})||{email:o.to})+'</div><button class="btn g" onclick="viewing=null;render()">Close</button></div>'}
  return h+'<div class="card"><h2>Sent archive</h2><div class="row"><select onchange="filter=this.value;render()"><option value="all">All categories</option>'+CATS.map(function(c){return '<option '+(filter===c?'selected':'')+'>'+c+'</option>'}).join('')+'</select><button class="btn g" style="margin:0" onclick="exportCsv(\'history\')">Export CSV</button></div>'+tbl(list,'h')+'<p class="note">Update status and engagement by hand until a provider reports delivery, bounces, opens and replies automatically.</p></div>';
}
function set(){
  var b=S.brand;
  return '<div class="card"><h2>Branding</h2><p class="note">Colors start from the green, gold and red in your eSaathi file. Upload the official logo here; it shows in the header and in every email.</p><label>Company name</label><input value="'+esc(b.name)+'" onchange="S.brand.name=this.value;save();applyBrand()"><div class="row"><div><label>Main color</label><input type="color" value="'+b.p+'" onchange="S.brand.p=this.value;save();applyBrand()"></div><div><label>Accent (buttons)</label><input type="color" value="'+b.a+'" onchange="S.brand.a=this.value;save()"></div></div><label>Official logo</label><input type="file" accept="image/*" onchange="if(this.files[0])shrink(this.files[0],240,function(u){S.brand.logo=u;save();applyBrand();render()})">'+(b.logo?'<p><img src="'+b.logo+'" alt="" style="max-height:44px;background:'+b.p+';padding:6px;border-radius:6px"> <button class="btn g" onclick="S.brand.logo=\'\';save();applyBrand();render()">Remove</button></p>':'')+'</div>'
   +'<div class="card"><h2>Sender emails (up to 5)</h2><p class="note">'+S.senders.map(esc).join(', ')+'</p><p class="note">You can also type any sender address directly in Campaign; new ones are remembered.</p><div class="row"><input id="ns" type="email" placeholder="sender@eservicebook.com.bd"><button class="btn" style="margin:0" onclick="addS()">Add sender</button><button class="btn g" style="margin:0" onclick="rmS()">Remove last</button></div></div>'
   +'<div class="card"><h2>Reply-to and signature</h2><label>Reply-to address (where replies go)</label><input type="email" value="'+esc(S.replyTo)+'" onchange="S.replyTo=this.value.trim();save()"><label>Signature added to every email</label><textarea onchange="S.sig=this.value;save()">'+esc(S.sig)+'</textarea></div>'
   +'<div class="card"><h2>Categories</h2><div>'+CATS.map(function(c){return '<button class="btn g" style="margin:2px;padding:4px 10px" '+(c==='other'?'disabled':'onclick="rmCat(\''+esc(c)+'\')"')+'>'+esc(c)+(c==='other'?'':' x')+'</button>'}).join('')+'</div><div class="row"><input id="nc" placeholder="New category, e.g. partner"><button class="btn" style="margin:0" onclick="addCat()">Add</button></div></div>'
   +'<div class="card"><h2>Daily send cap</h2><input id="cap" type="number" min="1" value="'+S.cap+'"><button class="btn" onclick="S.cap=Math.max(1,+v(\'cap\')||300);save();render()">Save</button></div>'
   +'<div class="card"><h2>Live events</h2><label style="display:flex;gap:8px;align-items:center;color:var(--tx)"><input type="checkbox" '+(S.live?'checked':'')+' onchange="S.live=this.checked;save()">Live mode: send through the server and check for opens, clicks, replies and unsubscribes</label><label>Admin token (same as ADMIN_TOKEN in Netlify)</label><input type="password" autocomplete="off" value="'+esc(S.token||'')+'" onchange="S.token=this.value.trim();save()"><p class="note">Leave Live mode off while testing: with it off, nothing is really sent.</p></div>'
   +'<div class="card"><h2>Delivery</h2><p class="note">Contacts, queues, caps and history live in this browser. With Live mode off, emails are only marked sent here. With Live mode on and the Part 2 functions deployed, they go out through your SMTP server.</p></div>';
}
function addCat(){var c=v('nc').trim().toLowerCase();if(c&&CATS.indexOf(c)<0){S.cats.push(c);CATS=S.cats;save();render()}}
function rmCat(c){if(S.contacts.some(function(x){return x.cat===c})){alert('Move or delete the contacts in this category first.');return}S.cats=S.cats.filter(function(x){return x!==c});CATS=S.cats;save();render()}
function addS(){var e=v('ns').trim().toLowerCase();if(okMail(e)&&S.senders.length<5&&S.senders.indexOf(e)<0){S.senders.push(e);save();render()}}
function rmS(){if(S.senders.length>1){S.senders.pop();save();render()}}

function render(){
  var f={dash:dash,contacts:contacts,compose:compose,tpl:tpl,hist:hist,alerts:alerts,set:set}[view],html=f();
  nav();document.getElementById('app').innerHTML=html;
  if(view==='compose'){if(pend){loadD(pend);pend=null}else prev()}
}
applyBrand();render();tick();
</script>
</body>
</html>
